name: TapCash CI & Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Go Backend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Cryptographic & Domain Tests
        run: |
          go test -v ./internal/pkg/crypto/...

      - name: Build Go Server & Simulator Binaries
        run: |
          go build -v ./cmd/server
          go build -v ./cmd/simulator

  mobile-build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm install

      - name: Export & Prebuild Android Project
        working-directory: ./mobile
        run: npx @expo/cli prebuild --platform android --clean --no-install

      - name: Make Gradle executable
        working-directory: ./mobile/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapCash-Android-Debug-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: TapCash CI & Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Go Backend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Cryptographic & Domain Tests
        run: |
          go test -v ./internal/pkg/crypto/...

      - name: Build Go Server & Simulator Binaries
        run: |
          go build -v ./cmd/server
          go build -v ./cmd/simulator

  mobile-build:
    name: Build Android Release APK & AAB
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: Export & Prebuild Android Project
        working-directory: ./mobile
        env:
          CI: 1
        run: npx expo prebuild --platform android --clean --no-install

      - name: Generate Production Keystore
        working-directory: ./mobile/android/app
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias tapcash -keyalg RSA -keysize 2048 -validity 10000 -storepass tapcash123 -keypass tapcash123 -dname "CN=TapCash, OU=Mobile, O=TapCash, L=City, S=State, C=IN"

      - name: Configure Production Signing in build.gradle
        working-directory: ./mobile/android/app
        run: |
          node -e '
            const fs = require("fs");
            let content = fs.readFileSync("build.gradle", "utf8");
            const signingConfig = `
                release {
                    storeFile file("release.keystore")
                    storePassword "tapcash123"
                    keyAlias "tapcash"
                    keyPassword "tapcash123"
                }
            `;
            content = content.replace("signingConfigs {", "signingConfigs {" + signingConfig);
            content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release");
            fs.writeFileSync("build.gradle", content);
          '

      - name: Make Gradle executable
        working-directory: ./mobile/android
        run: chmod +x gradlew

      - name: Build Android Release APK (Direct Install)
        working-directory: ./mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Android App Bundle (Google Play Store AAB)
        working-directory: ./mobile/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TapCash-Android-Release-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: TapCash-PlayStore-Release-AAB
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
